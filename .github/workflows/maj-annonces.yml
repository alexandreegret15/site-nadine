# Met à jour les annonces chaque jour à 6 h (heure de Paris en hiver), construit le blog et republie le site.
# Se lance aussi à chaque modification du dépôt (ex. un article enregistré dans Pages CMS).
name: Mise à jour des annonces

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 06:00 Paris (07:00 l'été)
  workflow_dispatch:       # bouton "Run workflow" pour lancer à la main
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  annonces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Construire le blog
        run: npm run blog
      # Les annonces peuvent échouer (site PP indisponible) : on publie quand même le blog
      # avec les annonces de la veille, puis on signale l'échec à la fin (e-mail GitHub).
      - name: Tester l'extraction
        id: test
        continue-on-error: true
        run: npm test
      - name: Récupérer les annonces
        id: annonces
        if: steps.test.outcome == 'success'
        continue-on-error: true
        run: npm run annonces
      - name: Enregistrer les changements
        if: steps.annonces.outcome == 'success'
        run: |
          git config user.name "maj-annonces"
          git config user.email "actions@users.noreply.github.com"
          git add -A site/data site/photos site/img
          git diff --cached --quiet || git commit -m "Annonces du $(date +%d/%m/%Y)"
          git pull --rebase
          git push
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Signaler un échec des annonces
        if: steps.test.outcome != 'success' || steps.annonces.outcome != 'success'
        run: |
          echo "::error::Les annonces n'ont pas pu être mises à jour (celles de la veille restent en ligne)."
          exit 1
